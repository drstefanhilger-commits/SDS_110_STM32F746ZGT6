; Alternative zu idf.py: PlatformIO mit Framework ESP-IDF (gleiche Quellen, sdkconfig.defaults)
;   pio run -t upload        (über USB-Serial/JTAG, GPIO18/19)
;   pio run -t menuconfig    (WLAN-Betriebsart, SSID, Passwort, Port)
[platformio]
src_dir = main

[env:esp32c3]
platform = espressif32
framework = espidf
board = esp32-c3-devkitm-1
board_build.flash_size = 4MB
monitor_speed = 115200
